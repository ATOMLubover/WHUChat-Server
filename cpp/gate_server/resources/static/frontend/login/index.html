<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="login-container">
        <h2>用户登录</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" required>
                <div class="error" id="emailError">请输入有效的邮箱地址</div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" required>
                <div class="error" id="passwordError">密码至少需要6位</div>
            </div>

            <div class="error" id="loginError" style="text-align: center; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" id="submitBtn">登录</button>
        </form>
    </div>

    <script src="scripts/main.js"></script>
</body>

</html>
