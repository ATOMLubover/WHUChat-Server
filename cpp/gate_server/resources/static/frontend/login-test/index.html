<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="login-container">
        <h2>用户登录</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" required>
                <div class="error" id="emailError">请输入有效的邮箱地址</div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" minlength="6" required>
                <div class="error" id="passwordError">密码至少需要6位</div>
            </div>

            <div class="form-group">
                <label for="captchaInput">验证码</label>
                <div class="captcha-group">
                    <input type="text" id="captchaInput" pattern="\d{4}" maxlength="4" required>
                    <button type="button" id="sendCaptcha">发送验证码</button>
                </div>
                <div class="error" id="captchaError">请输入4位数字验证码</div>
                <div class="success" id="captchaSent">验证码已发送</div>
            </div>

            <button type="submit" id="submitBtn">登录</button>
        </form>
    </div>

    <script src="scripts/main.js"></script>
</body>

</html>
